# Local Neo4j for RootFix's Phase 2 knowledge graph.
#
# Usage:
#   cp .env.template .env      # then fill in NEO4J_PASSWORD (and anything else you need)
#   docker compose up -d
#   # Browser UI: http://localhost:7474   Bolt: bolt://localhost:7687
#
# Nothing here is RootFix-specific beyond the container name/volume names --
# this is a single, minimal Neo4j service, not a wider infrastructure stack.
services:
  neo4j:
    image: neo4j:5-community
    container_name: rootfix-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt (used by the Python driver)
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your .env file}"
    volumes:
      - rootfix_neo4j_data:/data
      - rootfix_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rootfix_neo4j_data:
  rootfix_neo4j_logs:
